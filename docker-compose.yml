services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--threads", "2", "--timeout", "60", "app:app"]
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      NOTIFICATIONS_URL: http://notifications:5001
      REQUIRE_NOTIFICATIONS: "true"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      notifications:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/salud', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "notifications_service.py"]
    environment:
      PORT: "5001"
      NOTIFICATION_LOG_PATH: /var/lib/dangoko/notifications.jsonl
    volumes:
      - notification_data:/var/lib/dangoko
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/salud', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dangoko}
      POSTGRES_USER: ${DB_USER:-dangoko}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dangoko-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  notification_data:
